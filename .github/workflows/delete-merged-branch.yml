name: Remove merged pull-request branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'backup/')
    runs-on: ubuntu-latest
    steps:
      - name: Remove branch after successful merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh api --silent -X DELETE "repos/$REPOSITORY/git/refs/heads/$BRANCH_NAME"
          echo "Deleted merged branch: $BRANCH_NAME"
