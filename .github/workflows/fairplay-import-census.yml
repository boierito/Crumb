name: FairPlay public import census
on:
  push:
    branches: ['distribution/fairplay-import-census']
    paths: ['.github/workflows/fairplay-import-census.yml']
permissions:
  contents: read
jobs:
  census:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect imports of the exact public system daemon
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, pathlib, subprocess, tempfile
          root=pathlib.Path.cwd()
          spec=importlib.util.spec_from_file_location('exact',root/'scripts/generate-fairplay-next-block.py')
          exact=importlib.util.module_from_spec(spec);spec.loader.exec_module(exact)
          out=root/'artifacts';out.mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory(prefix='fairplay-import-census-') as directory:
              image=exact.exact_system_binary(directory)
              assert hashlib.sha256(image.read_bytes()).hexdigest()==exact.BINARY_HASH
              successful=0
              for option in ('-fixups','-bind','-imports'):
                  p=subprocess.run(['xcrun','dyld_info',option,str(image)],capture_output=True,text=True)
                  (out/(option[1:]+'.txt')).write_text(p.stdout+'\n'+p.stderr)
                  print(option,'status',p.returncode,'output bytes',len(p.stdout))
                  successful+=p.returncode==0 and len(p.stdout)>0
              if not successful: raise SystemExit('No public import inspection command succeeded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fairplay-public-imports
          path: artifacts/*
          if-no-files-found: error
      - name: Compare native pthread lock lifecycle on synthetic memory
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rwlock_probe.c" <<'C'
          #include <pthread.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          static void run(int mode) {
            pthread_rwlock_t l = PTHREAD_RWLOCK_INITIALIZER;
            if (mode == 1) { memset(&l, 0, sizeof(l)); printf("init=%d ", pthread_rwlock_init(&l, NULL)); }
            if (mode == 2) { printf("rdlock=%d ", pthread_rwlock_rdlock(&l)); }
            unsigned long before = l.__sig;
            int d = pthread_rwlock_destroy(&l);
            printf("mode=%d destroy=%d size=%zu before=%08lx after=%08lx\n", mode, d, sizeof(l), before, (unsigned long)l.__sig);
            if (mode == 2) { int u = pthread_rwlock_unlock(&l); int e = pthread_rwlock_destroy(&l); printf("unlock=%d destroy_after_unlock=%d\n", u, e); }
          }
          int main(void) { run(0); run(1); run(2); return 0; }
          C
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/rwlock_probe.c" -o "$RUNNER_TEMP/rwlock_probe"
          "$RUNNER_TEMP/rwlock_probe"
      - name: Measure lock state transitions with synthetic memory
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rwlock_bytes.c" <<'C'
          #include <pthread.h>
          #include <stdio.h>
          #include <string.h>
          static void dump(const char *label, pthread_rwlock_t *lock) {
            unsigned char *p=(unsigned char *)lock;
            printf("%s=",label);
            for (int i=0;i<200;i++) printf("%02x",(i>=64 && i<72) ? 0 : p[i]);
            puts("");
          }
          int main(void) {
            pthread_rwlock_t l; memset(&l, 0, sizeof(l));
            int a=pthread_rwlock_init(&l,0); dump("init",&l);
            int b=pthread_rwlock_rdlock(&l); dump("read_locked",&l);
            int c=pthread_rwlock_unlock(&l); dump("unlocked",&l);
            int d=pthread_rwlock_destroy(&l); dump("destroyed",&l);
            printf("results=%d,%d,%d,%d\n",a,b,c,d);
            return a||b||c||d;
          }
          C
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/rwlock_bytes.c" -o "$RUNNER_TEMP/rwlock_bytes"
          "$RUNNER_TEMP/rwlock_bytes"
      - name: Measure repeated synthetic reader transitions
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rwlock_repeat.c" <<'C'
          #include <pthread.h>
          #include <stdio.h>
          #include <string.h>
          static void dump(const char *label, pthread_rwlock_t *lock) {
            unsigned char *p=(unsigned char *)lock; printf("%s=",label);
            for (int i=32;i<48;i++) printf("%02x",p[i]); puts("");
          }
          int main(void) {
            pthread_rwlock_t l; memset(&l,0,sizeof(l));
            if (pthread_rwlock_init(&l,0)) return 1;
            if (pthread_rwlock_rdlock(&l)) return 2; dump("read1",&l);
            if (pthread_rwlock_rdlock(&l)) return 3; dump("read2",&l);
            if (pthread_rwlock_unlock(&l)) return 4; dump("unlock1",&l);
            if (pthread_rwlock_unlock(&l)) return 5; dump("unlock2",&l);
            if (pthread_rwlock_rdlock(&l)) return 6; dump("read3",&l);
            if (pthread_rwlock_unlock(&l)) return 7; dump("unlock3",&l);
            return pthread_rwlock_destroy(&l);
          }
          C
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/rwlock_repeat.c" -o "$RUNNER_TEMP/rwlock_repeat"
          "$RUNNER_TEMP/rwlock_repeat"
      - name: Measure default attributes and misaligned synthetic locks
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rwlock_align.c" <<'C'
          #include <pthread.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          static void dump(const char *label, pthread_rwlock_t *lock) {
            unsigned char *p=(unsigned char *)lock; printf("%s=",label);
            for (int i=0;i<64;i++) printf("%02x",p[i]); puts("");
          }
          int main(void) {
            _Alignas(16) unsigned char storage[224]; memset(storage,0,sizeof(storage));
            pthread_rwlock_t *l=(pthread_rwlock_t *)(void *)(storage+8);
            pthread_rwlockattr_t attr; int shared=0;
            if(pthread_rwlockattr_init(&attr)) return 1;
            if(pthread_rwlockattr_getpshared(&attr,&shared)) return 2;
            if(pthread_rwlock_init(l,&attr)) return 3; dump("misaligned_init",l);
            if(pthread_rwlock_rdlock(l)) return 4; dump("misaligned_read",l);
            if(pthread_rwlock_unlock(l)) return 5; dump("misaligned_unlock",l);
            if(pthread_rwlock_destroy(l)) return 6; dump("misaligned_destroy",l);
            if(pthread_rwlockattr_destroy(&attr)) return 7;
            printf("default_pshared=%d\n",shared);return 0;
          }
          C
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/rwlock_align.c" -o "$RUNNER_TEMP/rwlock_align"
          "$RUNNER_TEMP/rwlock_align"
      - name: Measure synthetic single-thread writer lifecycle
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rwlock_writer.c" <<'C'
          #include <pthread.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          static void dump(const char *label, pthread_rwlock_t *l) {
            unsigned char *p=(unsigned char *)l; printf("%s=",label);
            for (int i=32;i<48;i++) printf("%02x",p[i]);puts("");
          }
          int main(void) {
            pthread_rwlock_t l;memset(&l,0,sizeof(l));
            if(pthread_rwlock_init(&l,0)) return 1;
            for(int i=0;i<3;i++) {
              if(pthread_rwlock_wrlock(&l)) return 2; dump("writer_locked",&l);
              int b=pthread_rwlock_destroy(&l);printf("destroy_locked=%d\n",b);
              if(pthread_rwlock_unlock(&l)) return 3; dump("writer_unlocked",&l);
            }
            return pthread_rwlock_destroy(&l);
          }
          C
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/rwlock_writer.c" -o "$RUNNER_TEMP/rwlock_writer"
          "$RUNNER_TEMP/rwlock_writer"
      - name: Measure synthetic zero-signature lock errors
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rwlock_zero.c" <<'C'
          #include <pthread.h>
          #include <stdio.h>
          #include <string.h>
          int main(void) {
            pthread_rwlock_t a,b,c,d;memset(&a,0,sizeof(a));memset(&b,0,sizeof(b));memset(&c,0,sizeof(c));memset(&d,0,sizeof(d));
            int w=pthread_rwlock_wrlock(&a);int r=pthread_rwlock_rdlock(&b);int u=pthread_rwlock_unlock(&c);int x=pthread_rwlock_destroy(&d);
            printf("zero_signatures: writer=%d reader=%d unlock=%d destroy=%d\n",w,r,u,x);return 0;
          }
          C
          clang -Wall -Wextra -Werror "$RUNNER_TEMP/rwlock_zero.c" -o "$RUNNER_TEMP/rwlock_zero"
          "$RUNNER_TEMP/rwlock_zero"
