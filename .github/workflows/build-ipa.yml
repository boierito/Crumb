name: Build IPA
on:
  push:
    # Feature commits build via pull_request; avoid push/PR macOS cancellation races.
    branches: [main, 'release/**', 'fix/**', 'experiment/worse-query-no-helper']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional source revision'
        required: false
        default: ''
      release_tag:
        description: 'Optional existing draft tag to refresh with IPAs and corresponding sources'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ipa:
    name: Build ${{ matrix.configuration }} IPA
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios
      - name: Compile and link helper against the iOS SDK
        run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.4 -fobjc-arc -framework UIKit -framework Foundation -framework CoreGraphics -lz DecryptHelper/main.m DecryptHelper/CrumbJobControl.m DecryptHelper/CrumbMachO.c SharedDecrypt/CrumbDecrypt.c DecryptHelper/CrumbFileAccess.c DecryptHelper/CrumbLicenseResources.m DecryptHelper/CrumbIPAArchive.m -o "$RUNNER_TEMP/CrumbDecrypt-link-check"
      - name: Compile in-process probe against the iOS SDK
        run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.4 -fobjc-arc -fsyntax-only Crumb/LocalProbe/CrumbLocalProbe.m Crumb/LocalProbe/Vendor/worse_query.m
      - name: Test local probe recovery, cancellation and safe reports
        run: |
          xcrun --sdk macosx clang -fobjc-arc -framework Foundation -framework Security -lz tests/CrumbLocalProbeTests.m Crumb/LocalProbe/CrumbLocalProbe.m Crumb/LocalProbe/Vendor/worse_query.m Crumb/LocalProbe/SharedReader.c -o "$RUNNER_TEMP/CrumbLocalProbeTests"
          "$RUNNER_TEMP/CrumbLocalProbeTests"
      - name: Test helper cancellation and restart isolation
        run: |
          xcrun --sdk macosx clang -fobjc-arc -framework Foundation tests/CrumbJobControlTests.m DecryptHelper/CrumbJobControl.m -o "$RUNNER_TEMP/CrumbJobControlTests"
          "$RUNNER_TEMP/CrumbJobControlTests"
      - name: Test preserved resources and original IPA layout
        run: |
          xcrun --sdk macosx clang -g -fsanitize=address -fno-omit-frame-pointer -fobjc-arc -framework Foundation -lz tests/CrumbLicenseResourcesTests.m DecryptHelper/CrumbLicenseResources.m DecryptHelper/CrumbMachO.c DecryptHelper/CrumbFileAccess.c DecryptHelper/CrumbIPAArchive.m -o "$RUNNER_TEMP/CrumbLicenseResources-tests"
          "$RUNNER_TEMP/CrumbLicenseResources-tests" "$RUNNER_TEMP/CrumbArchiveFixture.ipa"
          python3 scripts/verify-preserved-root-fixture.py "$RUNNER_TEMP/CrumbArchiveFixture.ipa"
      - uses: actions/cache/restore@v4
        id: device-cache
        with:
          path: |
            NativeDevice/target
            build/Native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('NativeDevice/Cargo.lock', 'NativeDevice/vendor/**', 'MapleSyrup/NativeSAP/**', 'scripts/build-sap-native.sh', 'scripts/build-unicorn-tci.sh', 'scripts/prepare-unicorn-tci.py') }}
          restore-keys: device-${{ runner.os }}-${{ hashFiles('NativeDevice/Cargo.lock', 'NativeDevice/vendor/**') }}
      - name: Build and package unsigned IPA
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          python3 scripts/verify-crumb-branding.py
          mkdir -p artifacts
          cargo test --locked --manifest-path NativeDevice/Cargo.toml
          python3 scripts/test-cache-lease.py
          python3 scripts/test-local-probe-reader.py
          python3 scripts/test-device-macho.py
          python3 scripts/test-device-file-access.py
          python3 scripts/test-file-picker-injection.py
          swiftc Crumb/Device/DeviceConnectionPolicy.swift scripts/test-device-connection.swift -o "$RUNNER_TEMP/DeviceConnectionTests"
          "$RUNNER_TEMP/DeviceConnectionTests"
          swiftc Crumb/DownloadRecord.swift scripts/test-download-record.swift -o "$RUNNER_TEMP/DownloadRecordTests"
          "$RUNNER_TEMP/DownloadRecordTests"
          xcodebuild -version | tee artifacts/toolchain.txt
          xcodebuild -project Crumb.xcodeproj -scheme Crumb \
            -configuration "$CONFIGURATION" -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee artifacts/build.log
          mkdir -p build/package/Payload
          ditto "build/DerivedData/Build/Products/$CONFIGURATION-iphoneos/Crumb.app" \
            build/package/Payload/Crumb.app
          cd build/package
          zip -qry "../../artifacts/Crumb-$CONFIGURATION.ipa" Payload
          cd ../..
          if [ -f scripts/verify-ipa.py ]; then
            python3 scripts/verify-ipa.py "artifacts/Crumb-$CONFIGURATION.ipa" | tee "artifacts/verification-$CONFIGURATION.json"
          fi
          tar --exclude=target -czf artifacts/crumb-device-corresponding-source.tar.gz NativeDevice DecryptHelper SharedDecrypt Crumb/LocalProbe Crumb/Resources/WorseQuery-COPYING.txt tests scripts/build-device-native.sh scripts/test-local-probe-reader.py scripts/test-cache-lease.py docs/WORSE_QUERY_NO_HELPER.md
          if [ -f build/Native/unicorn-tci-corresponding-source.tar.gz ]; then
            cp build/Native/unicorn-tci-corresponding-source.tar.gz artifacts/
            cp build/Native/UNICORN-COPYING artifacts/
          fi
          if [ -f build/Native/ipatool-sap-corresponding-source.tar.gz ]; then
            cp build/Native/ipatool-sap-corresponding-source.tar.gz artifacts/
            cp build/Native/IPATOOL-LICENSE artifacts/
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.device-cache.outputs.cache-hit != 'true'
        with:
          path: |
            NativeDevice/target
            build/Native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('NativeDevice/Cargo.lock', 'NativeDevice/vendor/**', 'MapleSyrup/NativeSAP/**', 'scripts/build-sap-native.sh', 'scripts/build-unicorn-tci.sh', 'scripts/prepare-unicorn-tci.py') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Crumb-${{ matrix.configuration }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Crumb-*
          path: artifacts
          merge-multiple: true
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if DRAFT=$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$DRAFT" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" artifacts/*.ipa artifacts/*-corresponding-source.tar.gz \
              artifacts/UNICORN-COPYING artifacts/IPATOOL-LICENSE --repo "$REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" artifacts/*.ipa artifacts/*-corresponding-source.tar.gz \
            artifacts/UNICORN-COPYING artifacts/IPATOOL-LICENSE --repo "$REPOSITORY" \
            --draft --prerelease --title "$RELEASE_TAG" \
            --notes 'Unsigned development IPA; resign with a conventional sideloader. See IMPLEMENTATION.md and TESTING.md for verified milestones and limitations. Redistribution rights for the upstream project must be resolved before publication.'
