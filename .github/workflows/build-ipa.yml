name: Build IPA
on:
  push:
    # Feature commits build via pull_request; avoid push/PR macOS cancellation races.
    branches: [main, 'release/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional source revision'
        required: false
        default: ''
      release_tag:
        description: 'Optional existing draft tag to refresh with IPAs and corresponding sources'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ipa:
    name: Build ${{ matrix.configuration }} IPA
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios
      - name: Assemble pinned and SHA-256-verified iPadN SAP runtime
        run: python3 scripts/prepare-ipadn-sap-runtime.py
      - uses: actions/cache/restore@v4
        id: device-cache
        with:
          path: |
            NativeDevice/target
            build/Native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('NativeDevice/Cargo.lock', 'NativeDevice/vendor/**', 'MapleSyrup/NativeIPA/**', 'scripts/build-ipa-native.sh') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and package unsigned IPA
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          python3 scripts/verify-crumb-branding.py
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/toolchain.txt
          xcodebuild -project Crumb.xcodeproj -scheme Crumb \
            -configuration "$CONFIGURATION" -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee artifacts/build.log
          mkdir -p build/package/Payload
          ditto "build/DerivedData/Build/Products/$CONFIGURATION-iphoneos/Crumb.app" \
            build/package/Payload/Crumb.app
          cd build/package
          zip -qry "../../artifacts/Crumb-$CONFIGURATION.ipa" Payload
          cd ../..
          python3 scripts/verify-ipa.py "artifacts/Crumb-$CONFIGURATION.ipa" | tee "artifacts/verification-$CONFIGURATION.json"
          tar --exclude=target -czf artifacts/crumb-device-corresponding-source.tar.gz NativeDevice scripts/build-device-native.sh
          if [ -f build/Native/ipatool-ipa-corresponding-source.tar.gz ]; then
            cp build/Native/ipatool-ipa-corresponding-source.tar.gz artifacts/
            cp build/Native/IPATOOL-LICENSE artifacts/
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.device-cache.outputs.cache-hit != 'true'
        with:
          path: |
            NativeDevice/target
            build/Native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('NativeDevice/Cargo.lock', 'NativeDevice/vendor/**', 'MapleSyrup/NativeIPA/**', 'scripts/build-ipa-native.sh') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Crumb-${{ matrix.configuration }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Crumb-*
          path: artifacts
          merge-multiple: true
      - name: Create draft prerelease
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if DRAFT=$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$DRAFT" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" artifacts/*.ipa artifacts/*-corresponding-source.tar.gz \
              artifacts/IPATOOL-LICENSE --repo "$REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" artifacts/*.ipa artifacts/*-corresponding-source.tar.gz \
            artifacts/IPATOOL-LICENSE --repo "$REPOSITORY" \
            --draft --prerelease --title "$RELEASE_TAG" \
            --notes 'Unsigned development IPA; resign with a conventional sideloader. See README.md and docs/DEVELOPMENT.md for build instructions and limitations. Redistribution rights for the upstream project must be resolved before publication.'
