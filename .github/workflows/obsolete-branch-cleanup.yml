name: One-time obsolete branch cleanup
on:
  push:
    branches:
      - chore/repository-cleanup-20261122
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'boierito/Crumb' && contains(github.event.head_commit.message, '[prune-obsolete-branches]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          failed=0
          deleted=0
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            case "$branch" in
              main|chore/repository-cleanup-20261122|backup/main-before-decrypter-2026-11-06|fix/decrypted-ipa-export|ui/crumb-redesign)
                echo "Protected from cleanup: $branch" >&2; exit 1 ;;
            esac
            if gh api --silent -X DELETE "repos/$REPOSITORY/git/refs/heads/$branch"; then
              echo "Deleted: $branch"
              deleted=$((deleted+1))
            else
              echo "FAILED: $branch" >&2
              failed=$((failed+1))
            fi
          done <<'BRANCHES'
          distribution/fairplay-authorized-ff6da948
          distribution/fairplay-byte-loop-20261027-2235
          distribution/fairplay-complete-ee25a787
          distribution/fairplay-hotblocks-20261027-2346
          distribution/fairplay-import-census
          distribution/fairplay-state-export-23053
          distribution/23044
          distribution/23045
          distribution/23046-original-producer
          distribution/23047-account-authorization
          distribution/23048-authorization-routing
          distribution/23049-recovery-memory
          distribution/23050-complete-immutable-text
          distribution/23051-native-control-flow
          distribution/23052-atomic-license
          experiment/fairplay-vpn-no-helper-20261104
          experiment/worse-query-no-helper
          feature/app-group-decryption
          feature/crumb-coremedia-fairplayed-probe-20261031
          feature/fairplay-atomic-license-validation
          feature/fairplay-bootstrap-rootcause-23039
          feature/fairplay-consumer
          feature/fairplay-decryption
          feature/fairplay-download-actions
          feature/fairplay-dual-engine-23039
          feature/fairplay-engine-memory-contracts
          feature/fairplay-generic-runtime
          feature/fairplay-iphone-local-flow-23037
          feature/fairplay-keybag
          feature/fairplay-lab
          feature/fairplay-local-license-producer
          feature/fairplay-local-model-lifecycle
          feature/fairplay-local-system-pipeline
          feature/fairplay-multi-probe-23038
          feature/fairplay-native-control-flow
          feature/fairplay-runtime-ipa-import-20261031
          feature/fairplay-rwlock-runtime
          feature/fairplay-source-geometry
          feature/fairplay-standalone-helper-fallback-20261031
          feature/fairplay-target-23040
          feature/ipadn-233-account-privacy-fairplay
          feature/ipadn-login
          feature/on-device-pairing-decryption
          feature/2fa-clean-login-test
          fix/apple-login-204
          fix/fairplay-attempts
          fix/fairplay-authorized-download-session
          fix/fairplay-authorized-state-runtime
          fix/fairplay-complete-download-license
          fix/fairplay-consumer-io
          fix/fairplay-native-failure-contract
          fix/fairplay-next-block-aot
          fix/fairplay-phase-consistent-recovery
          fix/fairplay-recovery-validation-23041
          fix/fairplay-simple-decrypt
          fix/fairplay-validation-diagnostics
          fix/helper-user-flow
          release/2.0.0
          release/2.0.2
          research/fairplay-candidate-provenance
          research/fairplay-coreml-contract
          research/fairplay-direct-runtime
          research/fairplay-native-reference-contracts
          research/fairplay-sinf-header-contract
          research/fairplayed-system-helper
          BRANCHES
          echo "Deleted $deleted; failed $failed"
          if ((failed > 0)); then exit 1; fi
