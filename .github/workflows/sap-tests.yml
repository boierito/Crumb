name: SAP protocol tests
on:
  push:
    branches: [main, 'feature/**', 'release/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Verify download deletion boundaries
        run: |
          swiftc Crumb/Device/DeviceConnectionPolicy.swift scripts/test-device-connection.swift -o "$RUNNER_TEMP/DeviceConnectionTests"
          "$RUNNER_TEMP/DeviceConnectionTests"
          swiftc Crumb/DownloadRecord.swift scripts/test-download-record.swift -o /tmp/waffle-download-record-tests
          /tmp/waffle-download-record-tests
      - name: Test SAP protocol and native memory probe
        run: swift test --package-path MapleSyrup/SAPKit
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Verify streaming IPA preparation
        run: go -C MapleSyrup/NativeIPA test -race ./packageipa/...
