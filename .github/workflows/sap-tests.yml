name: SAP protocol tests
on:
  push:
    branches: [main, 'feature/**', 'release/**', 'fix/**', '!feature/fairplay-generic-runtime', '!fix/fairplay-validation-diagnostics']
  pull_request:
permissions:
  contents: read
concurrency:
  group: crumb-sap-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  fairplay-generic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install unicorn==2.1.4 keystone-engine==0.9.2 capstone==5.0.6 cryptography==46.0.3
      - name: Verify native reference tools compile and expose their CLI without private inputs
        run: |
          python3 -m py_compile scripts/prepare-fairplay-native-reference.py scripts/replay-fairplay-native-reference.py
          python3 scripts/replay-fairplay-native-reference.py --help
          python3 scripts/test-prepare-fairplay-native-reference.py
          python3 scripts/test-fairplay-sinf-header-audit.py
      - name: Differential generic interpreter, unknown PCs, aliases and resource validation
        run: python3 scripts/test-fairplay-generic.py
      - name: Compare real native byte-processing loop with independent ARM64 execution
        run: python3 scripts/test-fairplay-native-loop.py
      - name: Compare pinned recovery hotspots with independent ARM64 execution
        run: python3 scripts/test-fairplay-hot-blocks.py
      - name: Verify shipped generic profile, integrity and current device regression
        run: python3 scripts/test-fairplay-generic-real.py
      - name: Verify complete immutable image, preserved snapshot and independent recoveries
        run: python3 scripts/test-fairplay-image-memory.py
      - name: Verify generic execution release gate
        run: python3 scripts/verify-fairplay-generic-profile.py
  protocol:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Verify download deletion boundaries
        run: |
          swiftc WaffleStore/DownloadRecord.swift scripts/test-download-record.swift -o /tmp/waffle-download-record-tests
          /tmp/waffle-download-record-tests
      - name: Test iPhone-only FairPlay local recovery result gate
        run: |
          swiftc WaffleStore/App/FairPlayLocalRecoveryGate.swift scripts/test-fairplay-local-recovery-gate.swift -o /tmp/crumb-fairplay-local-gate
          /tmp/crumb-fairplay-local-gate
      - name: Test SAP protocol and native memory probe
        run: swift test --package-path MapleSyrup/SAPKit
  no-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install unicorn==2.1.4
      - name: Demonstrate Unicorn failure with executable mappings denied
        run: bash scripts/test-no-exec.sh
      - name: Verify TCI guest stack and hooks with executable mappings denied
        run: bash scripts/test-tci-host.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Test redacted next-target coverage inspector
        run: python3 scripts/test-inspect-fairplay-next-target.py
      - name: Verify mobile SINF and page primitives against independent reference vectors
        run: go -C MapleSyrup/NativeSAP/mobilelicense test -race ./...
      - name: Verify streaming IPA preparation
        run: go -C MapleSyrup/NativeSAP/packageipa test -race ./...

  fairplay-portable:
    runs-on: ubuntu-latest
    env:
      CRUMB_NATIVE_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Cache public portable build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: crumb-portable-${{ runner.os }}-${{ runner.arch }}-go126-${{ hashFiles('third_party/archives/*.tar.gz', 'third_party/unfairplay-generic/**', 'third_party/fairplay-immutable-image/**', 'MapleSyrup/NativeSAP/**/*.go', 'scripts/prepare-fairplay*.py', 'scripts/test-fairplay-host.sh') }}
          restore-keys: crumb-portable-${{ runner.os }}-${{ runner.arch }}-go126-
      - name: Verify authorization storage before compiling the recovery runtime
        run: go test -race MapleSyrup/NativeSAP/fairplayauthorizationstate.go MapleSyrup/NativeSAP/fairplaydownloadstate_test.go
      - name: Verify portable FairPlay and capture contracts with public fixtures
        run: bash scripts/test-fairplay-host.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install capstone==5.0.6 unicorn==2.1.4
      - name: Compare candidate translator with independent ARM64 execution
        run: python3 scripts/test-generate-fairplay-next-block.py
      - run: python3 -m pip install keystone-engine==0.9.2
      - name: Compare integrated bootstrap block with ARM64 reference
        run: python3 scripts/test-fairplay-next-block-differential.py
      - name: Compare bootstrap continuation with ARM64 reference
        run: python3 scripts/test-fairplay-bootstrap-exit-differential.py

  legacy-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Verify source overlay contracts
        run: python3 scripts/test-prepare-retained-storeagent.py
      - name: Verify retained producer with hash-pinned Apple code and non-JIT TCI
        run: bash scripts/test-sap-host.sh
