name: SAP protocol tests
on:
  push:
    branches: [main, 'feature/**', 'release/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: crumb-sap-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  fairplay-cfg-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit pinned public FairPlay code and model at iPhone failing branch
        run: |
          mkdir -p artifacts
          python3 scripts/audit-fairplay-public-cfg.py artifacts/fairplay-public-cfg-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: FairPlay-public-CFG-audit-${{ github.run_id }}
          path: artifacts/fairplay-public-cfg-audit.json
          if-no-files-found: error
  fairplay-macos27-profile:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Find exact hash-pinned public FairPlay code profile without jailbreak
        run: |
          python3 scripts/inspect-fairplay-macos-host.py artifacts/fairplay-macos27-code-profile.json
      - name: Check next unmapped target at 0xa4be38 without private data
        run: |
          python3 scripts/inspect-fairplay-next-target.py artifacts/fairplay-next-target.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development-only translator dependencies
        run: python3 -m pip install capstone==5.0.6 unicorn==2.1.4
      - name: Generate next-block Go review candidate from exact system profile
        run: python3 scripts/generate-fairplay-next-block.py --output artifacts/next-block-candidate.go.txt
      - name: Generate next missing block observed on iPhone 23042
        run: python3 scripts/generate-fairplay-next-block.py --target 0x1008c292c --output artifacts/next-block-8c292c.go.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FairPlay-macos27-code-profile-${{ github.run_id }}
          path: |
            artifacts/fairplay-macos27-code-profile.json
            artifacts/fairplay-next-target.json
            artifacts/next-block-candidate.go.txt
            artifacts/next-block-8c292c.go.txt
          if-no-files-found: error
  protocol:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Verify download deletion boundaries
        run: |
          swiftc WaffleStore/DownloadRecord.swift scripts/test-download-record.swift -o /tmp/waffle-download-record-tests
          /tmp/waffle-download-record-tests
      - name: Test iPhone-only FairPlay local recovery result gate
        run: |
          swiftc WaffleStore/App/FairPlayLocalRecoveryGate.swift scripts/test-fairplay-local-recovery-gate.swift -o /tmp/crumb-fairplay-local-gate
          /tmp/crumb-fairplay-local-gate
      - name: Test SAP protocol and native memory probe
        run: swift test --package-path MapleSyrup/SAPKit
  no-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install unicorn==2.1.4
      - name: Demonstrate Unicorn failure with executable mappings denied
        run: bash scripts/test-no-exec.sh
      - name: Verify TCI guest stack and hooks with executable mappings denied
        run: bash scripts/test-tci-host.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Test redacted next-target coverage inspector
        run: python3 scripts/test-inspect-fairplay-next-target.py
      - name: Verify streaming IPA preparation
        run: go -C MapleSyrup/NativeSAP/packageipa test -race ./...

  fairplay-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Verify portable FairPlay and capture contracts with public fixtures
        run: bash scripts/test-fairplay-host.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install capstone==5.0.6 unicorn==2.1.4
      - name: Compare candidate translator with independent ARM64 execution
        run: python3 scripts/test-generate-fairplay-next-block.py
      - run: python3 -m pip install keystone-engine==0.9.2
      - name: Compare integrated bootstrap block with ARM64 reference
        run: python3 scripts/test-fairplay-next-block-differential.py
