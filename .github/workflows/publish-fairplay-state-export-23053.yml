name: Publish verified private state export IPA
on:
  push:
    branches: [distribution/fairplay-state-export-23053]
    paths: ['.github/workflows/publish-fairplay-state-export-23053.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source and successful workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 40628923434 40628923653; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 387978093ad736740447b8ce1a64519cf199181e
          done
      - uses: actions/download-artifact@v4
        with:
          name: Crumb-IPA-Release-40628923653
          run-id: 40628923653
          github-token: ${{ github.token }}
          path: ipa-input
      - uses: actions/download-artifact@v4
        with:
          name: Crumb-Release-40628923653
          run-id: 40628923653
          github-token: ${{ github.token }}
          path: source-input
      - name: Verify IPA and stage corresponding sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, plistlib, zipfile, shutil, struct
          ipa = Path('ipa-input/Crumb-Release.ipa')
          expected = '607dc276aa5ec0425c21bc4ab05b1214dee01535a840212496ae3f1d78fc5593'
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              info = plistlib.loads(z.read('Payload/Crumb.app/Info.plist'))
              assert info['CFBundleVersion'] == '23053'
              assert info['CFBundleIdentifier'] == 'com.certlium.crumb'
              exe = z.read('Payload/Crumb.app/' + info['CFBundleExecutable'])
              assert struct.unpack_from('<II', exe) == (0xfeedfacf, 0x100000c)
              assert not any(p.endswith('embedded.mobileprovision') for p in z.namelist())
          out = Path('release'); out.mkdir()
          shutil.copyfile(ipa, out/'Crumb-23053-2026-10-28-0359-UTC.ipa')
          for name in ['IPATOOL-LICENSE', 'UNICORN-COPYING', 'ipatool-sap-corresponding-source.tar.gz', 'unicorn-tci-corresponding-source.tar.gz']:
              assert (Path('source-input')/name).is_file()
              shutil.copyfile(Path('source-input')/name, out/name)
          PY
      - name: Publish direct IPA download as an experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=test-state-export-23053-20261028-0359-utc
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite' >&2
            exit 1
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" \
            --target 387978093ad736740447b8ce1a64519cf199181e \
            --title 'Crumb experimental · 2026-10-28 03:59 UTC' --prerelease \
            --notes 'Unsigned IPA compiled from commit 3879780, build 23053. Adds explicit private licensing-state export for host replay; no upload is automatic. This experimental build does not establish SINF validation or successful decryption. CI passed, including native loop and hotspot comparisons and portable tests. Re-sign using your usual method. SHA-256: 607dc276aa5ec0425c21bc4ab05b1214dee01535a840212496ae3f1d78fc5593.'
