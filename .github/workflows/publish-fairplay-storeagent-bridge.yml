name: Publish verified StoreAgent to fairplayd bridge IPA
on:
  push:
    branches: [fix/fairplay-phase-consistent-recovery]
    paths:
      - '.github/workflows/publish-fairplay-storeagent-bridge.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish-tested-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful pinned tests and IPA build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 1ac3af146ccc40dc1621686f6e4acc22dd76aa43
        shell: bash
        run: |
          set -euo pipefail
          for RUN in 40421405861 40421405930; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$SOURCE_SHA"
          done
      - name: Download exact tested unsigned Release IPA
        uses: actions/download-artifact@v4
        with:
          name: Crumb-IPA-Release-40421405930
          run-id: 40421405930
          github-token: ${{ github.token }}
          path: ipa-input
      - name: Download license notices and corresponding sources
        uses: actions/download-artifact@v4
        with:
          name: Crumb-Release-40421405930
          run-id: 40421405930
          github-token: ${{ github.token }}
          path: source-input
      - name: Verify release IPA SHA256, metadata and source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, plistlib, zipfile, shutil
          ipa = Path('ipa-input/Crumb-Release.ipa')
          expected = 'a9128362b75747d55964fb02a907e06d2869895e1819a530df3b8b3656d2d7fa'
          assert ipa.is_file(), 'Pinned IPA not found'
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == expected, 'Pinned IPA SHA256 mismatch'
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, 'Invalid IPA ZIP'
              info = plistlib.loads(archive.read('Payload/Crumb.app/Info.plist'))
              assert info['CFBundleVersion'] == '23045', 'Unexpected internal app build'
              assert info['CFBundleIdentifier'] == 'com.certlium.crumb'
              assert not any(name.endswith('embedded.mobileprovision') for name in archive.namelist())
          shutil.copyfile(ipa, 'release/Crumb-23045-storeagent-fairplayd-bridge-Release.ipa')
          for filename in [
              'IPATOOL-LICENSE', 'UNICORN-COPYING',
              'ipatool-sap-corresponding-source.tar.gz',
              'unicorn-tci-corresponding-source.tar.gz',
          ]:
              src = Path('source-input') / filename
              assert src.is_file(), 'Missing license or source: '+filename
              shutil.copyfile(src, Path('release') / filename)
          print('VERIFIED IPA SHA256:', expected)
          PY
      - name: Publish immutable diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=test-23045-storeagent-fairplayd-bridge
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite' >&2
            exit 1
          fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --target 1ac3af146ccc40dc1621686f6e4acc22dd76aa43 \
            --title 'Crumb 23045 · StoreAgent → fairplayd bridge research (PR #12)' \
            --prerelease \
            --notes 'Unsigned iOS research IPA from PR #12 pinned to source commit 1ac3af14. All five SAP protocol suites and iOS native plus Debug/Release builds passed. This revision implements a real read-only StoreAgent 10.9 -> fairplayd 26A428 provenance bridge audit with conservative SIDB geometry classification, missing SIDD reporting, per-phase state lookups, and bounded public unsupported-import slot diagnostics. The original SINF must pass strict validation to accept a derived model. It does not export private files, credentials, model candidates, keys, or plaintext. It does not implement the missing legitimate cross-generation enrollment transform or decrypt a FairPlay IPA. Build 23045, unsigned; sign locally with an authorized certificate. SHA256: a9128362b75747d55964fb02a907e06d2869895e1819a530df3b8b3656d2d7fa. User must sign by their own iPhone installation method. Private enrollment material is never included.'
