name: Publish verified FairPlay state lookup IPA
on:
  push:
    branches: [fix/fairplay-phase-consistent-recovery]
    paths:
      - '.github/workflows/publish-fairplay-state-lookup.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish-tested-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful pinned tests and IPA build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 88bebba5bbf820c79c17fdf5e1fc7648cde7caf4
        shell: bash
        run: |
          set -euo pipefail
          for RUN in 40399732398 40399732325; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$SOURCE_SHA"
          done
      - name: Download exact tested unsigned Release IPA
        uses: actions/download-artifact@v4
        with:
          name: Crumb-IPA-Release-40399732325
          run-id: 40399732325
          github-token: ${{ github.token }}
          path: ipa-input
      - name: Download license notices and corresponding sources
        uses: actions/download-artifact@v4
        with:
          name: Crumb-Release-40399732325
          run-id: 40399732325
          github-token: ${{ github.token }}
          path: source-input
      - name: Verify release IPA SHA256, metadata and source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, plistlib, zipfile, shutil
          ipa = Path('ipa-input/Crumb-Release.ipa')
          expected = '7d32f74de282162d7bf2be9aab713de8bea43bbfb1200d182c3f92a4249a0812'
          assert ipa.is_file(), 'Pinned IPA not found'
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == expected, 'Pinned IPA SHA256 mismatch'
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, 'Invalid IPA ZIP'
              info = plistlib.loads(archive.read('Payload/Crumb.app/Info.plist'))
              assert info['CFBundleVersion'] == '23045', 'Unexpected internal app build'
              assert info['CFBundleIdentifier'] == 'com.certlium.crumb'
              assert not any(name.endswith('embedded.mobileprovision') for name in archive.namelist())
          shutil.copyfile(ipa, 'release/Crumb-23045-state-lookups-Release.ipa')
          for filename in [
              'IPATOOL-LICENSE', 'UNICORN-COPYING',
              'ipatool-sap-corresponding-source.tar.gz',
              'unicorn-tci-corresponding-source.tar.gz',
          ]:
              src = Path('source-input') / filename
              assert src.is_file(), 'Missing license or source: '+filename
              shutil.copyfile(src, Path('release') / filename)
          print('VERIFIED IPA SHA256:', expected)
          PY
      - name: Publish immutable diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=test-23045-state-lookups
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite' >&2
            exit 1
          fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --target 88bebba5bbf820c79c17fdf5e1fc7648cde7caf4 \
            --title 'Crumb 23045 · state-file lookup diagnostics (PR #12)' \
            --prerelease \
            --notes 'Unsigned iOS diagnostic IPA from PR #12 source 88bebba5, verified by all pinned protocol, portable, generic, no-JIT and Debug/Release iOS checks. Internal CFBundleVersion remains 23045. This version includes the proven phase-consistent checkpoint plus exact safe classification of model/SINF binding error classification and privacy-safe SIDB/SIDD/SIDF lookup counters. Does not alter model selection, key material, plaintext verification, or acceptance criteria. No authorized IPA has yet been decrypted and validated on-device. SHA256: 7d32f74de282162d7bf2be9aab713de8bea43bbfb1200d182c3f92a4249a0812. User must sign by their own iPhone installation method. Private enrollment material is never included.'
